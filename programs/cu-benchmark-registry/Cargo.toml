[package]
name = "cu-benchmark-registry"
version = "0.1.0"
description = "On-chain compute-unit benchmark registry for Solana program instructions"
edition = "2021"
license = "ISC"

[lib]
crate-type = ["cdylib", "lib"]
name = "cu_benchmark_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"

# Declare the cfgs that the Anchor/Solana entrypoint macros emit, so the
# `unexpected_cfgs` lint stays useful without flagging generated code.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
