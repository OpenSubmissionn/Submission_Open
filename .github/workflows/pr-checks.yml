name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        # MED-02: `npm ci` installs strictly from the committed lockfile and
        # FAILS on any drift, so a PR can't silently pull unpinned/newer
        # transitive versions. (Lifecycle scripts stay enabled here because the
        # build needs them, e.g. esbuild's postinstall — the install path that
        # disables scripts is install.sh, which only installs the CLI.)
        run: npm ci

      - name: Audit production dependencies
        # Surface known CVEs in runtime deps. Non-blocking so a fresh advisory
        # doesn't wedge every PR, but it's visible in the checks output.
        run: npm audit --omit=dev || true

      - name: Build workspace
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: services/coverage
