# Rust workspace for OPEN DevTool on-chain programs.
# Scoped to `programs/*` so it never touches the npm workspace (cli/services/web/api).
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
